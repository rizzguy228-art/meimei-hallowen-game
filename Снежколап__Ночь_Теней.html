addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});
function msg(t){const m=$('msg');m.textContent=t;m.style.opacity=1;clearTimeout(msg.t);msg.t=setTimeout(()=>m.style.opacity=0,3800)}
function useDoor(){
 if(!inside){const d=doorNear();if(d){inside=d;exitPos.copy(player.position);player.position.set(d.ox,0,3.8);yaw=Math.PI;sfx.door();msg('Вы вошли: '+d.name)}}
 else if(Math.abs(player.position.x-inside.ox)<1.4&&player.position.z>3.6){const h=inside;inside=null;sfx.door();player.position.set(h.x,0,h.z+3.2);yaw=0}}
function doorNear(){for(const h of houses)if(Math.hypot(player.position.x-h.x,player.position.z-(h.z+2.2))<2.2)return h;return null}
function knock(t){if(!inside||!ntg||inside.visited)return;const h=inside;h.visited=true;vis++;act={k:t,t:0};h.react={k:t,t:0};burst(t);$('prompt').style.display='none';
 if(t==='treat'){sfx.treat();mood('happy');const c=h.mood==='friendly'?3:h.mood==='mystery'?5:1,r=h.mood==='suspicious'?0:2;candy+=c;rep+=r;msg(h.name+': +'+c+' 🍬. '+h.clue)}
 else{sfx.trick();mood('evil');candy+=1;rep-=3;msg('Шалость удалась! 🎃 Жители в ярости. '+h.clue)}
 $('candy').textContent=candy;$('rep').textContent=rep;$('vis').textContent=vis;
 if(vis===5)setTimeout(()=>msg('Вы обошли все дома! Улики указывают на пугало у кладбища... (продолжение следует)'),4200)}
window.knock=knock;

function burst(k){const p=player.position,T=k==='treat';for(let i=0;i<26;i++){const c=T?[0xff4060,0xffd040,0x60e0ff,0xb060ff,0x70ff70][i%5]:[0x8a30ff,0xff3030][i%2];
 const m=T?new THREE.Mesh(new THREE.SphereGeometry(.07,6,6),new THREE.MeshBasicMaterial({color:c,transparent:true})):new THREE.Sprite(glowM(c));if(!T)m.scale.setScalar(.8);
 m.position.set(p.x,p.y+1.2,p.z);const a=Math.random()*6.28,v=(1.5+Math.random()*2.5)*(T?.8:1.4);scene.add(m);fxs.push({m,vx:Math.cos(a)*v,vy:T?3+Math.random()*3:.5+Math.random()*2,vz:Math.sin(a)*v,l:1.2,T})}}
function update(dt){
 const T=performance.now()/1e3;anim.forEach(f=>f(T,dt));
 for(let i=fxs.length-1;i>=0;i--){const f=fxs[i];f.l-=dt;f.m.position.x+=f.vx*dt;f.m.position.z+=f.vz*dt;f.m.position.y+=f.vy*dt;if(f.T)f.vy-=9*dt;else f.m.scale.setScalar(f.m.scale.x+dt*2);f.m.material.opacity=Math.min(1,f.l);if(f.l<=0){scene.remove(f.m);fxs.splice(i,1)}}moonL.position.set(player.position.x-12,26,player.position.z+12);moonL.target.position.copy(player.position);
 const sp=(keys['shift']?9:5)*dt,tn=2.2*dt;
 if(keys['a']||keys['arrowleft'])yaw+=tn;if(keys['d']||keys['arrowright'])yaw-=tn;
 let mv=0;if(keys['w']||keys['arrowup'])mv=sp;if(keys['s']||keys['arrowdown'])mv=-sp*.6;
 const p=player.position;p.x+=Math.sin(yaw)*mv;p.z+=Math.cos(yaw)*mv;player.rotation.y=yaw;p.y=inside?.08:0;
 if(inside){const ox=inside.ox;p.x=Math.max(ox-4.4,Math.min(ox+4.4,p.x));p.z=Math.max(-4.4,Math.min(4.9,p.z));
  if(p.z>4.2&&Math.abs(p.x-ox)>1)p.z=4.2;
  const n=new THREE.Vector3(ox,0,-2),dx=p.x-n.x,dz=p.z-n.z,dd=Math.hypot(dx,dz);if(dd<.9){p.x=n.x+dx/dd*.9;p.z=n.z+dz/dd*.9}}
 else{p.x=Math.max(-150,Math.min(150,p.x));p.z=Math.max(-145,Math.min(40,p.z));
  for(const h of houses){const dx=p.x-h.x,dz=p.z-h.z,ox=2.7-Math.abs(dx),oz=2.7-Math.abs(dz);
   if(ox>0&&oz>0){if(ox<oz)p.x+=Math.sign(dx)*ox;else p.z+=Math.sign(dz)*oz}}}
 tt+=mv!==0?dt*(keys['shift']?13:9):dt*1.5;if(mv!==0){stepT-=dt;if(stepT<=0){step(!!inside);stepT=keys['shift']&&mv>0?.26:.4}}else stepT=0;owlT-=dt;if(owlT<=0){sfx.owl();owlT=10+Math.random()*15}const sw=mv!==0?.7:0;
 legs[0].rotation.x=Math.sin(tt)*sw;legs[3].rotation.x=Math.sin(tt)*sw;legs[1].rotation.x=-Math.sin(tt)*sw;legs[2].rotation.x=-Math.sin(tt)*sw;
 tailSegs.forEach((s,i)=>s.position.x=Math.sin(tt*.6+i*.5)*.05*i);
 leo.position.y=mv!==0?Math.abs(Math.sin(tt))*.04:0;leo.visible=third;leo.rotation.set(0,0,0);leo.scale.setScalar(1.15);
 if(act){act.t+=dt;const u=act.t/1.6;if(u>=1)act=null;else if(act.k==='treat'){leo.position.y=Math.abs(Math.sin(u*Math.PI*3))*.35;leo.rotation.x=Math.sin(u*Math.PI*6)*.18;tailSegs.forEach((s,i)=>s.position.x=Math.sin(act.t*14+i*.5)*.12*i)}
  else{leo.scale.y=1.15*(1-.22*Math.sin(Math.min(1,u*4)*Math.PI));const w=Math.max(0,(u-.25)/.75);leo.rotation.y=w*Math.PI*4;leo.position.y=Math.sin(w*Math.PI)*.5}}
 // подсказки
 const hint=$('hint');let ht='';ntg=false;
 if(inside){const ox=inside.ox,d=Math.hypot(p.x-ox,p.z+2);
  if(d<3.2){ntg=true;if(!inside.visited){$('ph').textContent=inside.name;$('pt').textContent='Хозяин улыбается из полумрака... Что выберешь?'}}
  else if(p.z>3.6&&Math.abs(p.x-ox)<1.4)ht='E — выйти на улицу';
  $('prompt').style.display=(ntg&&!inside.visited)?'block':'none';if(ntg&&inside.visited)ht='Хозяин уже вас угостил';}
 else{$('prompt').style.display='none';const d=doorNear();if(d)ht='E — войти: '+d.name+(d.visited?' (уже были)':'')}
 hint.style.display=ht?'block':'none';hint.textContent=ht;
 // камера
 const f=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));
 if(third){const dist=inside?3.6:6,tp=p.clone().addScalar(0).sub(f.clone().multiplyScalar(dist));tp.y=inside?2.6:3.4;
  if(inside){tp.x=Math.max(inside.ox-4.6,Math.min(inside.ox+4.6,tp.x));tp.z=Math.max(-4.6,Math.min(4.6,tp.z))}
  camera.position.lerp(tp,Math.min(1,dt*8));camera.lookAt(p.x,1.2,p.z)}
 else{camera.position.set(p.x+f.x*.6,1.75,p.z+f.z*.6);camera.lookAt(p.x+f.x*5,1.6,p.z+f.z*5)}}
camera.position.set(0,3.4,18);
let last=performance.now();
(function loop(){requestAnimationFrame(loop);const n=performance.now(),dt=Math.min(.05,(n-last)/1000);last=n;update(dt);renderer.render(scene,camera)})();
}
